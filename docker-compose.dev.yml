services:
  backend:
    build: ./backend
    volumes:
      - ./kellerlog:/app/data
    environment:
      - WINEAPI_KEY=${WINEAPI_KEY:-}
      - KELLERLOG_SECRET_KEY=${KELLERLOG_SECRET_KEY:-dev-secret-do-not-use-in-production}
      - KELLERLOG_ADMIN_USER=${KELLERLOG_ADMIN_USER:-admin}
      - KELLERLOG_ADMIN_PASSWORD=${KELLERLOG_ADMIN_PASSWORD:-}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_DEV_BUILD: "true"
    ports:
      - "8080:80"
    depends_on:
      - backend
    environment:
      - BACKEND_HOST=backend
    restart: unless-stopped
