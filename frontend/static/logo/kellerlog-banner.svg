  <text x="282" y="192" font-family="ui-monospace, 'Cascadia Code', monospace" font-size="22" fill="rgba(0,255,136,0.85)" letter-spacing="1">wine management · self-hosted · open source</text>

  <!-- Right decoration: log lines -->
  <rect x="1080" y="80"  width="80" height="6" rx="3" fill="rgba(0,255,136,0.20)"/>
  <rect x="1060" y="96"  width="100" height="6" rx="3" fill="rgba(0,255,136,0.12)"/>
  <rect x="1070" y="112" width="90" height="6" rx="3" fill="rgba(0,255,136,0.16)"/>
  <rect x="1050" y="128" width="110" height="6" rx="3" fill="rgba(0,255,136,0.10)"/>
