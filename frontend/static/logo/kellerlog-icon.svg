<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="icon-clip">
      <rect x="0" y="0" width="512" height="512" rx="112"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="#1A1A2E"/>

  <g clip-path="url(#icon-clip)">
    <!-- Stem -->
    <path d="M256 108 Q256 88 256 72" stroke="#9B8040" stroke-width="7" fill="none" stroke-linecap="round"/>
    <!-- Tendril left -->
    <path d="M256 90 Q222 68 214 48" stroke="#9B8040" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- Leaf -->
    <path d="M214 48 Q194 26 208 12 Q232 8 238 34 Q240 44 214 48Z" fill="#3A7A30"/>

    <!-- Grape cluster: row 1 (2) -->
    <circle cx="234" cy="175" r="44" fill="#7B45A8"/>
    <circle cx="300" cy="175" r="44" fill="#6B35A0"/>
    <!-- Row 2 (3) -->
    <circle cx="200" cy="255" r="42" fill="#8B55B8"/>
    <circle cx="266" cy="255" r="42" fill="#7B45A8"/>
    <circle cx="332" cy="255" r="42" fill="#6B35A0"/>
    <!-- Row 3 (3) -->
    <circle cx="218" cy="330" r="40" fill="#7B45A8"/>
    <circle cx="284" cy="330" r="40" fill="#8B55B8"/>
    <circle cx="350" cy="330" r="40" fill="#6535A0"/>
    <!-- Row 4 (2) -->
    <circle cx="248" cy="400" r="38" fill="#7040A8"/>
    <circle cx="318" cy="400" r="38" fill="#7B45A8"/>
    <!-- Tip -->
    <circle cx="284" cy="465" r="34" fill="#6B35A0"/>

    <!-- Terminal cursor block -->
    <rect x="80" y="434" width="22" height="32" rx="3" fill="#00FF88"/>
    <!-- Log lines -->
    <rect x="112" y="438" width="110" height="10" rx="3" fill="rgba(0,255,136,0.80)"/>
    <rect x="112" y="454" width="78"  height="10" rx="3" fill="rgba(0,255,136,0.50)"/>
    <rect x="112" y="470" width="96"  height="10" rx="3" fill="rgba(0,255,136,0.65)"/>
  </g>
</svg>
